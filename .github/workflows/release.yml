name: CI & Release

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'AGENTS.md'
      - '**/AGENTS.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'AGENTS.md'
      - '**/AGENTS.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check custom_components tests

      - name: Ruff format check
        run: ruff format --check custom_components tests

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=custom_components --cov-report=term-missing

      - name: Coverage gate (HA-owned scheduler core)
        run: |
          python -m coverage report \
            --include="*/airzone_cloud/scheduler.py,*/airzone_cloud/schedule_store.py" \
            --fail-under=85

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate manifest.json
        run: |
          python -c "
          import json, sys
          with open('custom_components/airzone_cloud/manifest.json') as f:
              m = json.load(f)
          required = ['domain', 'name', 'version', 'requirements']
          for key in required:
              if key not in m:
                  print(f'Missing required key: {key}')
                  sys.exit(1)
          print(f'Manifest OK: {m[\"domain\"]} v{m[\"version\"]}')
          "

      - name: Validate hacs.json
        run: |
          python -c "
          import json
          with open('hacs.json') as f:
              h = json.load(f)
          print(f'HACS config OK: {h[\"name\"]}')
          "

      - name: Validate JS syntax
        run: node -c custom_components/airzone_cloud/airzone-schedules-card.js

      - name: Card copies in sync
        run: |
          diff -q airzone-schedules-card.js \
            custom_components/airzone_cloud/airzone-schedules-card.js \
            || { echo "::error::card copies differ — keep both byte-identical"; exit 1; }

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # These publishing checks require repository-level metadata or brand assets.
          ignore: brands license topics

  release:
    name: Release
    needs: [lint, test, validate, hassfest, hacs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          CURRENT=$(jq -r '.version' custom_components/airzone_cloud/manifest.json)
          if git rev-parse --verify --quiet "refs/tags/v${CURRENT}" >/dev/null; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            VERSION="$CURRENT"
          fi
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"
          jq --arg v "$VERSION" '.version = $v' custom_components/airzone_cloud/manifest.json > tmp.json
          mv tmp.json custom_components/airzone_cloud/manifest.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/airzone_cloud/manifest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Bump version to ${{ steps.version.outputs.new }}"
          fi
          git push

      - name: Create zip for HACS
        run: |
          cd custom_components/airzone_cloud
          zip -r ../../airzone_cloud.zip . -x "__pycache__/*" "*.pyc"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: v${{ steps.version.outputs.new }}
          body: |
            Automated release v${{ steps.version.outputs.new }}

            Commit: ${{ github.sha }}
          files: airzone_cloud.zip
          generate_release_notes: true
