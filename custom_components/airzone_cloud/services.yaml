get_installation_schedules:
  name: "Get Installation Schedules"
  description: "Lists the Home-Assistant-owned Airzone schedules (config_entry is accepted but ignored; scheduling is HA-owned now)."
  fields:
    config_entry:
      name: Config Entry
      description: The ID of the Airzone Cloud integration config entry.
      required: true
      selector:
        config_entry:
          integration: airzone_cloud

delete_installation_schedule:
  name: "Delete Installation Schedule"
  description: "Deletes a specific schedule from an Airzone Cloud installation."
  fields:
    config_entry:
      name: Config Entry
      description: The ID of the Airzone Cloud integration config entry.
      required: true
      selector:
        config_entry:
          integration: airzone_cloud
    schedule_id:
      name: Schedule ID
      description: The ID of the schedule to delete.
      required: true
      selector:
        text:


post_installation_schedule:
  name: "Create Installation Schedule"
  description: "Creates a new schedule for an Airzone Cloud installation."
  fields:
    config_entry:
      name: Config Entry
      description: The ID of the Airzone Cloud integration config entry.
      required: true
      selector:
        config_entry:
          integration: airzone_cloud
    schedule_data:
      name: Schedule Data
      description: The JSON object containing schedule parameters.
      required: true
      selector:
        object:

patch_installation_schedule:
  name: "Update Installation Schedule"
  description: "Updates an existing schedule for an Airzone Cloud installation."
  fields:
    config_entry:
      name: Config Entry
      description: The ID of the Airzone Cloud integration config entry.
      required: true
      selector:
        config_entry:
          integration: airzone_cloud
    schedule_id:
      name: Schedule ID
      description: The ID of the schedule to update.
      required: true
      selector:
        text:
    schedule_data:
      name: Schedule Data
      description: The JSON object containing schedule parameters.
      required: true
      selector:
        object:

toggle_schedule:
  name: "Toggle Schedule"
  description: "Enable or disable schedules by name and/or tags."
  fields:
    config_entry:
      name: Config Entry
      description: The Airzone Cloud integration config entry.
      required: false
      selector:
        config_entry:
          integration: airzone_cloud
    schedule_name:
      name: Schedule Name(s)
      description: One or more schedule names to toggle. Can be combined with tags.
      required: false
      example: "Winter Day"
      selector:
        object:
    tags:
      name: Tags
      description: One or more tags to match. A schedule is selected if its name matches OR it carries ANY of these tags.
      required: false
      example: '["away", "winter"]'
      selector:
        object:
    all:
      name: All
      description: Toggle all schedules. When true, ignores name/tag filters.
      required: false
      selector:
        boolean:
    enabled:
      name: Enabled
      description: Whether the matching schedules should be enabled or disabled.
      required: true
      selector:
        boolean:

get_schedule_tags:
  name: "Get Schedule Tags"
  description: "Gets the locally-stored tags for all schedules."
  fields:
    config_entry:
      name: Config Entry
      description: The ID of the Airzone Cloud integration config entry.
      required: false
      selector:
        config_entry:
          integration: airzone_cloud

set_schedule_tags:
  name: "Set Schedule Tags"
  description: "Sets the tags for a specific schedule (replaces the existing tags). Tags are stored locally."
  fields:
    config_entry:
      name: Config Entry
      description: The ID of the Airzone Cloud integration config entry.
      required: false
      selector:
        config_entry:
          integration: airzone_cloud
    schedule_id:
      name: Schedule ID
      description: The Airzone schedule ID to tag.
      required: true
      selector:
        text:
    tags:
      name: Tags
      description: The full list of tags for this schedule. Pass an empty list to clear all tags.
      required: true
      example: '["away", "winter"]'
      selector:
        object:
